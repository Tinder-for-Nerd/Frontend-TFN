name: promatch_flutter
description: "ProMatch - Tinder for Nerds"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0

  # Realtime
  socket_io_client: ^3.0.2

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.4

  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI Components
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  responsive_framework: ^1.5.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.17

  # Charts & Analytics
  fl_chart: ^0.70.2

  # Calendar
  table_calendar: ^3.1.3

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Video Calls
  flutter_webrtc: ^0.12.3

  # Utilities
  intl: ^0.19.0
  connectivity_plus: ^6.1.1
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3
  # hive_generator removed due to source_gen conflict with freezed
  mockito: ^5.4.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/mock_data/
